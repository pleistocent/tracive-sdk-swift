# The Xcode project for the sample, declared rather than hand-written. The .xcodeproj next to this
# file is generated, and committed only so the repository opens and runs with nothing installed.
#
#   brew install xcodegen && cd ExtendedExample && xcodegen generate
#
# The sandbox scheme is the default integration. `demo` runs against demo-server.py, for seeing the
# screens with no Tracive app and no grant.
name: TraciveExtendedSample

configs:
  Debug-sandbox: debug
  Release-sandbox: release
  Debug-demo: debug
  Release-demo: release

options:
  bundleIdPrefix: id.tracive.sdk.extended
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  TraciveSDK:
    path: ..

targets:
  TraciveExtendedSample:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Info.plist
        buildPhase: none

    dependencies:
      - package: TraciveSDK
        product: TraciveSDKExtended
      - package: TraciveSDK
        product: TraciveSDKExtendedUI

    configFiles:
      Debug-sandbox: Flavors/sandbox.xcconfig
      Release-sandbox: Flavors/sandbox.xcconfig
      Debug-demo: Flavors/demo.xcconfig
      Release-demo: Flavors/demo.xcconfig

    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.2.2"

schemes:
  sandbox:
    build:
      targets:
        TraciveExtendedSample: all
    run:
      config: Debug-sandbox
    archive:
      config: Release-sandbox
  demo:
    build:
      targets:
        TraciveExtendedSample: all
    run:
      config: Debug-demo
    archive:
      config: Release-demo
