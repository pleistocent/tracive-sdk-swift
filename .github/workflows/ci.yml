name: CI

# Every unit test in this package runs offline against injected fakes — the Tracive Open API does
# not exist yet, and no test may depend on a live host. If a job here ever needs network access to
# go green, something has been wired up wrong.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + swift test (macOS)
    # macOS because the package targets iOS 15 / macOS 12 and leans on CryptoKit, Security and the
    # system libsqlite3. None of it exists on a Linux runner.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Take the newest Xcode on the image rather than pinning one version. A hard pin breaks
        # every time GitHub rotates its images, and the previous "pin if present, else whatever"
        # form silently accepted any toolchain — including one too old to run the language-mode
        # checks below, which would have made those checks quietly meaningless.
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -switch "$latest"
          fi
          xcode-select -p
          swift --version

      - name: Require a Swift 6 toolchain
        # The language-mode gate below needs `-swift-version 6`, which only exists from Swift 6.0.
        # On an older toolchain that flag is rejected and the step would fail for the wrong reason,
        # or — worse, if it were made conditional — silently skip. Fail here instead, with a
        # message that says what is actually wrong.
        run: |
          major=$(swift -version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9]*\)\..*/\1/p' | head -1)
          if [ -z "$major" ] || [ "$major" -lt 6 ]; then
            echo "::error::This workflow requires a Swift 6 toolchain; found: $(swift -version 2>&1 | head -1)"
            exit 1
          fi

      - name: No third-party dependencies
        # A partner integrating a fraud-check SDK takes on our supply chain, so this package has
        # none — and this step is what keeps it that way.
        #
        # It replaces a guard that could not fail. That one ran `swift package resolve` and then
        # inspected `Package.resolved` only `if [ -f ... ]`. For a dependency-free manifest
        # `swift package resolve` writes no `Package.resolved` at all, so the body never executed
        # and the step was unconditionally green. It also silently assumed the v2 file format (a v1
        # file uses "package"/"repositoryURL" and would have slipped through), and it covered only
        # the root manifest — `Example/Package.swift` has a real `dependencies:` array and no guard
        # whatsoever, so a third-party package added to the public example would have shipped
        # unchecked.
        #
        # Asserting on the manifest itself avoids all of that: `dump-package` always produces
        # output, so there is no "file missing, therefore fine" path. A local path dependency
        # serialises under "fileSystem" and is allowed — that is how the Example consumes the SDK
        # the way a partner would; every other kind fails the build.
        #
        # Verified in both directions locally: adding a `.package(url:)` to either manifest makes
        # this exit 1 naming the offending manifest, and the clean tree passes.
        run: |
          for manifest in . Example; do
            if ! dump=$(swift package --package-path "$manifest" dump-package 2>&1); then
              echo "::error::could not read ${manifest}/Package.swift"
              echo "$dump"
              exit 1
            fi
            remote=$(printf '%s' "$dump" | python3 -c '
          import json, sys
          deps = json.load(sys.stdin).get("dependencies", [])
          print(", ".join(sorted({k for d in deps for k in d if k != "fileSystem"})))
          ')
            if [ -n "$remote" ]; then
              echo "::error::third-party dependency declared in ${manifest}/Package.swift (kind: ${remote}). This package ships into partner apps and must stay dependency-free."
              exit 1
            fi
            echo "ok: no third-party dependency in ${manifest}/Package.swift"
          done

      - name: The grammar fixture still has the bytes it is pinned to
        # `query-grammar-vectors.json` is vendored byte-identically into four SDK repositories, and
        # identical bytes are the whole mechanism by which they are known to agree: one `shasum` per
        # repository, four identical answers, nothing to interpret.
        #
        # Nothing here checked that. `QueryGrammarTests` decodes the file and drives its vectors, so
        # it reads the fixture's *meaning* and is blind to its bytes — an audit reformatted this
        # fixture from 21 662 bytes to 32 533 and watched all 259 tests stay green. Reformatting is
        # harmless to this SDK and fatal to the cross-repo contract: once one copy is reformatted the
        # comparison stops being answerable, and the next real grammar change lands in a copy nobody
        # can diff against the others.
        #
        # `swift test` also fails on a changed digest (`testTheFixtureMatchesItsPinnedContentHash`),
        # which is what makes it fail on a developer's machine before it ever reaches CI. Both read
        # the same sidecar file, so there is one digest to update and no way for the two to disagree.
        #
        # A red step here is not re-pinned to make it green. A grammar change starts at the Tracive
        # API and lands in all four SDKs together.
        run: shasum -a 256 -c Tests/TraciveSDKTests/Fixtures/query-grammar-vectors.sha256

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Swift 6 language mode
        # `swift-tools-version:5.9` means the package builds in Swift 5 mode, where data-race
        # diagnostics are warnings or absent entirely. The doc comments here make strong
        # concurrency claims — single-flight refresh, `Sendable` conformances, `@unchecked Sendable`
        # on several types — and nothing mechanically checked any of them.
        #
        # The module is clean under this flag today, so turning it on now is free and only guards
        # against regression. Enforced here rather than by bumping the manifest to
        # `swift-tools-version:6.0`, which would raise the minimum Xcode for every partner
        # consuming the package — a cost paid by integrators for a guarantee only we need.
        #
        # Verified to be capable of failing: a plain `swift build` accepts a nonisolated global
        # mutable var without a single diagnostic, while this step rejects it with
        # "not concurrency-safe because it is nonisolated global shared mutable state".
        run: swift build -Xswiftc -swift-version -Xswiftc 6

      - name: Strict concurrency, warnings as errors
        # `-strict-concurrency=complete` on its own only *warns*, so as a CI step it could never go
        # red — a check that cannot fail. `-warnings-as-errors` is what gives it teeth, and it also
        # keeps the build warning-clean, which it is today.
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build for iOS
        # `swift build` on this runner compiles for macOS only, so everything behind
        # `#if canImport(UIKit)` or `#if os(iOS)` is never compiled by the two steps above. That is
        # the whole of `UIKitAppLauncher` — the only production launcher, and the one that actually
        # performs the app-to-app hop — plus the directory and file protection-class code in
        # `SQLiteCheckCache`. On macOS the SDK substitutes `UnavailableAppLauncher`, so a completely
        # broken iOS launcher would leave the rest of this workflow green.
        #
        # Verified rather than assumed: introducing a type error inside `UIKitAppLauncher` leaves
        # `swift build` passing and fails this step. iOS is the platform the SDK is sold for, so it
        # has to be compiled here.
        #
        # `xcodebuild` because plain `swift build` has no iOS destination. No test run: there is no
        # simulator boot in this job, and compiling is what catches the regression class above.
        run: |
          xcodebuild \
            -scheme TraciveSDK \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            build

  build-example:
    name: build the example app
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Take the newest Xcode on the image rather than pinning one version. A hard pin breaks
        # every time GitHub rotates its images, and the previous "pin if present, else whatever"
        # form silently accepted any toolchain — including one too old to run the language-mode
        # checks below, which would have made those checks quietly meaningless.
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -switch "$latest"
          fi
          xcode-select -p
          swift --version

      - name: Require a Swift 6 toolchain
        # The language-mode gate below needs `-swift-version 6`, which only exists from Swift 6.0.
        # On an older toolchain that flag is rejected and the step would fail for the wrong reason,
        # or — worse, if it were made conditional — silently skip. Fail here instead, with a
        # message that says what is actually wrong.
        run: |
          major=$(swift -version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9]*\)\..*/\1/p' | head -1)
          if [ -z "$major" ] || [ "$major" -lt 6 ]; then
            echo "::error::This workflow requires a Swift 6 toolchain; found: $(swift -version 2>&1 | head -1)"
            exit 1
          fi

      - name: Build Example
        # The example consumes the SDK exactly as a partner would, through a local path dependency.
        # Building it here is what stops the README's sample code from rotting.
        working-directory: Example
        run: swift build -v
